services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: scheduling
      POSTGRES_USER: scheduling
      POSTGRES_PASSWORD: scheduling
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgres://scheduling:scheduling@db:5432/scheduling
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - ./backend:/app

  # auth-service e frontend entram aqui quando existirem (próximas fases)

volumes:
  db_data:
